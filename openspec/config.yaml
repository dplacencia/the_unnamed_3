schema: spec-driven

context: |
  Read AGENTS.md and its linked OpenSpec sources before work. The initial
  decision record is openspec/changes/establish-frontend-foundation/.
  Product, branding, technical and process definitions belong in OpenSpec.
  Preserve the distinction between user-approved source decisions, proposed
  wording, unresolved questions and verified implementation. Ask the user
  before adopting an undefined choice; do not treat silence as approval.
  This repository covers the backoffice and landing page as separate products
  deployed separately under different subdomains. The backoffice serves only
  merchant teams; an internal platform operator backoffice is outside its scope.
  TailAdmin is the required backoffice foundation; the landing page may use
  custom design and code.
  Initial design and messaging target greengrocers and small neighbourhood shops
  for now. Backoffice users range from people who can barely open an app to
  highly skilled technical users. Preserve extreme everyday simplicity and
  advanced configuration depth. The interface is simple by default and users
  choose when to expose complexity; depth does not change automatically based
  on usage. Tier count, UI controls, preference scope and persistence remain
  undefined.
  The initial market is Spain only. Initial frontend languages are Spanish
  (main and default), English, Catalan, Galician and Basque. Further suggestions require
  the user's approval before inclusion.
  The six agreed core values are in the product-values capability of the
  initial change. The approved personality is warm, approachable and quietly
  confident, with precise, straightforward language. Irin (intended Spanish
  pronunciation: first-syllable stress) is the leading naming candidate for now.
  Ilé Irin remains in the naming record; no final name has been selected.
  Brand positioning, slogans and product definitions are secular and must not
  imply religious endorsement. The name's origin may be explained accurately
  when relevant; a discoverable cultural or religious connection is acceptable.
  The name remains provisional; the approved initial visual basics are recorded
  in the brand change below.
  The user prefers AWS Console over Azure and Google Cloud consoles as a
  reference for the expert end of the user spectrum, not a beginner baseline.
  Naturgy and Lowi names/brand concepts are negative trust
  references for the user. These are personal preferences; specific liked or
  disliked traits require clarification. TailAdmin remains the backoffice base.
  Positioning centers on an approachable modernization and digitalization
  experience for merchants. Modularity supports that experience and is not the
  sole differentiator. Support combines in-product guidance and human assistance
  for onboarding/migration on merchant request; detailed service commitments
  remain open. A frontend
  AI assistant for finding/explaining settings and possibly helping business
  setup is a future feature idea, not an approved implementation or launch promise.
  Competitor-complexity comparisons are not verified market findings.
  The backoffice uses the supplied TailAdmin Next.js edition (React, strict
  TypeScript and Tailwind), as selected by the user. This repository uses pnpm
  workspaces with apps/backoffice and apps/landing. Each app has independent
  development/build/deployment boundaries. Node.js 26 LTS and pinned stable pnpm
  are selected, initially Node 26.13.1 and pnpm 12.18.0. Retain the template's
  locked app dependencies for the initial setup rather than silently upgrading.
  The landing page uses Astro, selected separately from the backoffice. Shared
  packages follow actual reuse by both apps; identity/session integration remains
  deferred. The user selected both
  apps as static files in S3 behind AWS CloudFront. The backoffice uses Next.js
  static export and resolves language preferences in the browser after a neutral
  loading state, avoiding a flash of Spanish before a remembered language.
  Each app has a separate private S3 bucket and CloudFront distribution, with
  origin reads through OAC and a distribution-scoped bucket policy. Use regular
  S3 origins, not website endpoints. Resource names, environments, domains,
  routing, cache policy and infrastructure tooling remain open. No Docker
  packaging was approved and no AWS resources have been created.
  Backoffice URLs are shared across languages; a host-only cookie stores explicit
  preference. Spanish is first when no valid preference exists; do not infer the
  UI language from browser headers. The landing uses Spanish at / and localized
  /en, /ca, /gl and /eu paths. The language cookie retains explicit choices for
  one year (365 days), with no account-level or cross-device preference implied.
  Current assignment: openspec/changes/define-backoffice-navigation/.
  Latest steering: after committing the branding batch, the user selected
  "Backoffice navigation and module structure" as the next design topic. Discuss
  the overall navigation model, then the initial module/shared-area map, honest
  availability, context, access visibility, shared settings/help, labels and depth.
  The user selected "One shared sidebar, grouped by module (Recommended)";
  NAV-001 records this primary navigation model. The user then selected
  "Enabled modules + separate discovery (Recommended)" under NAV-002: the main
  sidebar's module entries show business-enabled modules, with other available
  modules discoverable separately. The user selected "Inventory + shared areas
  first (Recommended)" under NAV-003, defining first-map design coverage without
  a launch commitment or availability claim. The user then selected "Use this
  map as the starting point (Recommended)" under NAV-004: Inventario contains
  Productos, Existencias, Movimientos, Recuentos and Configuración del inventario,
  with pending movement work inside Movimientos. Shared entries are Inicio,
  Explorar módulos, Configuración del negocio and Ayuda. The user selected
  "One module group open at a time (Recommended)" under NAV-005: groups are
  collapsible, entering a module opens its group, opening another closes the
  previous one, and shared entries stay directly accessible outside groups.
  The user selected "Hide sections the person cannot access (Recommended)" under
  NAV-006: show permitted sections when permissions are known, hide groups with
  no accessible sections, and show clear access denial for restricted direct
  links. Roles and grants remain separate. The user selected "Loading/error only
  where access must be checked (Recommended)" under NAV-007: neutral loading in
  affected navigation/content, clear error with Retry on check failure, unrelated
  controls usable, and no unknown/failure represented as confirmed denial.
  The user selected "Independent location selection per page (Recommended)"
  under NAV-008: each relevant Inventory page owns its location selection and
  shows the scope near its heading; changing one does not implicitly switch
  another page's selection. The user selected "Sole location automatic; otherwise
  ask and remember per tab (Recommended)" under NAV-009: select a sole known
  accessible location, ask if several and no choice exists, remember each page's
  explicit choice while the tab stays open, and always show scope. Closing the
  tab ends this retention; mutation targets remain separate. Review the first
  prototype's selected layout under NAV-010: the user chose "Use this layout for
  the prototype (Recommended)". Place Inicio at the top, Inventario in the middle,
  and Explorar módulos, Configuración del negocio and Ayuda at the bottom. Keep
  TailAdmin desktop sidebar/tablet-mobile drawer and close the drawer on selection.
  The development-only Storybook prototype is implemented and verified under
  its bounded plan, with simulated access/location states and neutral content.
  All 388 existing reference comparisons pass; the user approved all 84 final
  navigation images from run 2026-11-12T21-36-33.733Z with "I approve all revisions.".
  Those exact references are promoted, preserving the existing 388. The design
  records exact source/environment/run identities and preview retention limits.
  Preserve production routes, dependencies, landing and approved image references;
  do not promote new candidates automatically.
  Latest user review selected "Single content error + compact page frame
  (Recommended)". NAV-011–013 correct the compact Inventory caret, show an access
  failure once in main content with Retry, and reclaim page space through a slim
  title/location toolbar, no large empty card and preview notices in Storybook
  documentation. Preserve readable text/control sizes. The user's Excel reference
  establishes efficient space as a priority; it does not select table columns,
  row density, spreadsheet editing or a new global density mode. The
  bounded revision is implemented and verified with 54 code tests, 40 browser
  checks and 76 revised candidate captures passing. All 388 approved comparisons
  still pass. The prior 72 and revised 76 images are not approved.
  Second review: fix the whole compact Inventory trigger footprint and icon
  sizing/alignment, not only caret visibility, under refined NAV-011. The user
  selected "One compact toolbar with page controls (Recommended)" under NAV-014:
  combine menu, page title, location where applicable and theme controls in the
  preview; preserve control sizes and visibility with responsive wrapping.
  Follow section 5 of the prototype plan. Do not modify the production header
  or introduce hover-activated controls from the unselected alternative.
  Section 5 is implemented and verified: compact control footprint/icons match
  neighbors, compact keyboard activation opens rail+group with honest announced
  state, and the combined desktop toolbar measures 53px with retained controls.
  All 76 candidates from that revision and 388 approved reference comparisons pass; images
  remain unapproved and no production routes, staging or commits follow.
  Third review: the user chose "Use this compact direction and folding footer
  (Recommended)" under NAV-015–017: 64px collapsed rail, centred 44px targets and
  16px icons; borderless 16px-icon header actions sized 36px desktop or 44px
  tablet/mobile; shared footer folding under "Más opciones", initially open.
  Additional steering under NAV-018 asks for a thinner Ubicación selector: use
  the retained 36px desktop variant, preserving 44px tablet/mobile targets,
  14px text and selection behavior. Section 6 is implemented and verified with
  54 code tests, 43 browser checks, 84 current captures and 388 approved comparisons.
  The exact current capture is 2026-11-12T21-36-33.733Z; its 84 images are now
  specifically approved and promoted. The user's commit-preparation request and
  image approval authorize two staging batches: navigation code/specifications,
  then approved references. Stage each separately and give the user the commit
  command; never execute a commit. No production primitive changes, new
  persistence policy, archive or deployment are authorized.
  The post-approval full comparison 2026-11-12T21-47-49.746Z passes all 472
  accepted cases with zero failed, skipped or flaky cases. Final pnpm check and
  strict OpenSpec validation also pass. Preserve the recorded approval identities.
  Record user choices before UI implementation. Preserve the approved brand and
  screenshot baseline; product-creation flows and landing work remain later.
  Read-only sibling module sources constrain proposals without selecting a launch
  module list or claiming every defined capability is implemented. No hosting,
  identity/API architecture, integration, staging or commit follows from this step.
  Brand record: the user said "go ahead" to defining brand basics before
  customizing TailAdmin. This starts discussion of visual emphasis followed by
  concrete colour/typography options and minimum identity treatment. The user
  selected "Restrained and approachable (Recommended)": warm neutral backgrounds,
  clear typography, strong contrast and limited accent colour. Prepare the scoped
  TailAdmin comparison in the brand change's plan. The user subsequently selected
  D/ink indigo (#57528C) as the colour basis and Source Sans 3 as the typeface
  basis, explicitly choosing it after the licence clarification. The user selected
  a simple Irin text wordmark in Source Sans 3 for now, with a bespoke symbol
  deferred and the name still provisional. The user selected retaining TailAdmin's
  existing spacing, rounded corners and icons for the first backoffice appearance.
  The user approved the brand change's concrete first-configuration proposal:
  full option-D indigo/warm-neutral mapping, existing text sizes/weights, and exact
  wordmark styling (semibold, 32px expanded / 20px compact). Implement that
  backoffice scope under the recorded plan, preserving the landing and current
  reference images. Approval of this configuration is not new image approval.
  The first pass is applied. A measured ordinary dark-brand-text contrast
  shortfall was identified. The user
  approved existing brand-300 (#B4ACD7) for the affected text roles, keeping the
  palette and primary accent. BRAND-007 is now applied and verified, with
  46 code tests, 27 browser checks and all 388 final candidate captures passing.
  The user then said "I approve them all" for all 388 images from final run
  2026-11-12T17-47-13.318Z. All are promoted with verbatim approval and exact
  source/environment/profile/image identities; full comparison passes all 388.
  The design records the evidence. The initial backoffice brand configuration
  and image approval are complete; future reference changes need new specific
  approval. Product-flow design remains a later phase and does not start automatically.
  Keep Irin provisional and record the user's
  choices before applying them. Preserve current apps and accepted references
  while choices remain pending. The repository's module/shared-code organization,
  landing styling/interactions and code-convention/local-quality choices are
  implemented and verified in the technical change. The visual workflow is also
  implemented; do not reopen those completed technology decisions.
  The user selected
  Storybook for backoffice components, native Astro previews and Playwright,
  with pinned Chromium on this Mac. Cover desktop 1440x900, tablet 768x1024,
  mobile 390x844, desktop dark mode and five-language assembled views, including
  registered interaction states. The user approved per-pixel colour threshold
  0.01 with maxDiffPixels 0. The user also keeps esbuild@0.28.2's install script
  explicitly blocked alongside the
  existing exact-version script denials. Preserve the release waiting period.
  Candidate captures are not accepted references; require specific user review
  before promoting named cases. Preserve the
  existing technical foundation and its approved landing/quality choices.
  On 2026-11-12 the user explicitly approved all 368 images from review run
  2026-11-12T13-05-47.261Z. The visual change and references registry record that
  acceptance with source/environment/image identities and verbatim approval.
  This approval does not extend to future changed captures or final branding.
  Catalogue examples now use development-only dictionaries for all five locales.
  Language changes update fixture labels/descriptions/errors while retaining typed
  values, explicit custom labels and open state. These strings are technical
  examples, not approved product copy; tool/native-browser text is separate.
  Latest scope correction: finish this repository's own technology stack first.
  Hosting/CDN choices are sufficiently defined; do not initiate further questions
  about them. Keycloak/API integration and infrastructure/deployment work are
  deferred, not prerequisites for this phase. The repository organization,
  landing styling/interactions and local quality choices are now selected below.
  Other undefined choices still need the user's decision.
  The user has now approved React Hook Form + Zod for backoffice forms and
  client-side validation, with the standard Zod resolver and retained TailAdmin
  controls. Initial exact pins are react-hook-form 7.91.0, zod 4.6.7 and
  @hookform/resolvers 7.0.5. Install only the selected foundation; do not invent product forms,
  business rules, value coercion, visual patterns or landing dependencies.
  The user approved React state/reducers with scoped Context as the backoffice
  UI-state default. Retain compliant theme/locale/sidebar state and built-in
  browser subscription helpers; no state library, common wrapper or new
  persistence behavior is implied. Form state stays with React Hook Form.
  The user selected feature folders with shared code added when reused. Future
  backoffice features keep components/hooks/schemas/tests under src/features/<feature>
  where applicable; src/app composes routes. Generic TailAdmin and shared app
  infrastructure retain their existing locations. Keep the apps independent and
  introduce shared workspace packages only for code actually consumed by both.
  No speculative feature/package scaffold or runtime migration follows now.
  The user selected Tailwind 4 with native Astro components and TypeScript scripts
  for small landing interactions. Tailwind and its Vite plugin are pinned at
  4.3.3, matching the backoffice. No React integration, shared brand tokens,
  marketing content or interaction component is selected by this foundation.
  The user selected repository-wide ESLint and Prettier with two-space indentation,
  double quotes and semicolons, plus pnpm check for formatting/lint/types/code
  tests. Retain framework-aware lint/format support and exclusions for generated,
  tooling/dependency/cache and third-party/reference files. Builds and browser/
  visual checks remain separate, and image acceptance still needs specific review.
  The earlier work order was: define and implement technical decisions;
  then define brand basics and configure TailAdmin; then define and establish
  the design/visual change comparison and evaluation workflow; only afterwards
  consider product flows and visuals. The subsequent visual-workflow implementation
  is complete; latest steering returns to the three local stack decisions above.
  Follow visual/README.md and preserve the visual change's review rules.
  Implementation of approved technical choices is authorized within that
  assignment, but unresolved choices still require the user's decision.
  Writes and command execution are authorized only within this repository's
  assigned scope. The sibling the_unnamed_1 and the_unnamed_2 repositories are
  read-only. Never create commits. No app implementation or deployment follows
  automatically from this documentation setup or from successful validation.

rules:
  proposal:
    - State the user instruction, exact scope and exclusions; keep recommendations distinct from approved decisions.
  specs:
    - Preserve approved meaning and unresolved choices; do not add product behavior merely to fill a template.
    - Give each requirement a stable identifier and scenarios describing expected behavior, not claimed test results.
  design:
    - Link decisions to actual user instructions and flag any choice still needing the user's answer.
  tasks:
    - Keep the detailed checklist here and state the permitted files and verification for each task.
    - A checked task records work and checks performed; it does not mean user acceptance or authorization for another stage.

context: |
  Read AGENTS.md and its linked OpenSpec sources before work. The initial
  decision record is openspec/changes/establish-frontend-foundation/.
  Product, branding, technical and process definitions belong in OpenSpec.
  Preserve the distinction between user-approved source decisions, proposed
  wording, unresolved questions and verified implementation. Ask the user
  before adopting an undefined choice; do not treat silence as approval.
  This repository covers the backoffice and landing page as separate products
  deployed separately under different subdomains. The backoffice serves only
  merchant teams; an internal platform operator backoffice is outside its scope.
  TailAdmin is the required backoffice foundation; the landing page may use
  custom design and code.
  Initial design and messaging target greengrocers and small neighbourhood shops
  for now. Backoffice users range from people who can barely open an app to
  highly skilled technical users. Preserve extreme everyday simplicity and
  advanced configuration depth. The interface is simple by default and users
  choose when to expose complexity; depth does not change automatically based
  on usage. Tier count, UI controls, preference scope and persistence remain
  undefined.
  The initial market is Spain only. Initial frontend languages are Spanish
  (main and default), English, Catalan, Galician and Basque. Further suggestions require
  the user's approval before inclusion.
  The six agreed core values are in the product-values capability of the
  initial change. The approved personality is warm, approachable and quietly
  confident, with precise, straightforward language. Irin (intended Spanish
  pronunciation: first-syllable stress) is the leading naming candidate for now.
  Ilé Irin remains in the naming record; no final name has been selected.
  Brand positioning, slogans and product definitions are secular and must not
  imply religious endorsement. The name's origin may be explained accurately
  when relevant; a discoverable cultural or religious connection is acceptable.
  The name remains provisional; the approved initial visual basics are recorded
  in the brand change below.
  The user prefers AWS Console over Azure and Google Cloud consoles as a
  reference for the expert end of the user spectrum, not a beginner baseline.
  Naturgy and Lowi names/brand concepts are negative trust
  references for the user. These are personal preferences; specific liked or
  disliked traits require clarification. TailAdmin remains the backoffice base.
  Positioning centers on an approachable modernization and digitalization
  experience for merchants. Modularity supports that experience and is not the
  sole differentiator. Support combines in-product guidance and human assistance
  for onboarding/migration on merchant request; detailed service commitments
  remain open. A frontend
  AI assistant for finding/explaining settings and possibly helping business
  setup is a future feature idea, not an approved implementation or launch promise.
  Competitor-complexity comparisons are not verified market findings.
  The backoffice uses the supplied TailAdmin Next.js edition (React, strict
  TypeScript and Tailwind), as selected by the user. This repository uses pnpm
  workspaces with apps/backoffice and apps/landing. Each app has independent
  development/build/deployment boundaries. Node.js 26 LTS and pinned stable pnpm
  are selected, initially Node 26.13.1 and pnpm 12.18.0. Retain the template's
  locked app dependencies for the initial setup rather than silently upgrading.
  The landing page uses Astro, selected separately from the backoffice. Shared
  packages follow actual reuse by both apps; identity/session integration remains
  deferred. The user selected both
  apps as static files in S3 behind AWS CloudFront. The backoffice uses Next.js
  static export and resolves language preferences in the browser after a neutral
  loading state, avoiding a flash of Spanish before a remembered language.
  Each app has a separate private S3 bucket and CloudFront distribution, with
  origin reads through OAC and a distribution-scoped bucket policy. Use regular
  S3 origins, not website endpoints. Resource names, environments, domains,
  routing, cache policy and infrastructure tooling remain open. No Docker
  packaging was approved and no AWS resources have been created.
  Backoffice URLs are shared across languages; a host-only cookie stores explicit
  preference. Spanish is first when no valid preference exists; do not infer the
  UI language from browser headers. The landing uses Spanish at / and localized
  /en, /ca, /gl and /eu paths. The language cookie retains explicit choices for
  one year (365 days), with no account-level or cross-device preference implied.
